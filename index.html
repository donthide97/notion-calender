<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --body-bg: #f0f0f0;
            --wood-gradient: linear-gradient(135deg, #ecd0a5 0%, #e1b366 100%);
            --dial-bg: #1c1a17;
            --text-white: #ffffff;
            --divider: rgba(255, 255, 255, 0.1);
            --anim-speed: 0.69s;
            /* Wir nutzen cqw (Container Query Width), damit es sich am Notion-Block orientiert */
            --base-unit: 1cqw; 
            --gap: 0.8cqw;

        }

        body { 
            margin: 0; 
            height: 100vh; 
            width: 100vw;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: transparent !important; 
            font-family: 'Arial Black', sans-serif;
            /* Container-Type aktivieren, damit Kinder sich auf die Body-Breite beziehen können */
            container-type: size; 
            overflow: hidden;
        }

        .karlsson-container {
            /* Keine festen Pixel mehr! */
            width: 95cqw; 
            max-width: 95vw;
            
            background: var(--wood-gradient);
            border-radius: 6cqw; /* Radius skaliert mit */
            padding: 4cqw; 
            box-shadow: 0 2cqw 5cqw rgba(0,0,0,0.3), inset 0 0.2cqw 0.5cqw rgba(255,255,255,0.5);
            box-sizing: border-box;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .inner-dial {
            width: 100%; 
            background: var(--dial-bg);
            border-radius: 4cqw;
            padding: 5cqw; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 5cqw;
            align-items: center;
        }

        .header-year {
            width: 100%;
            display: flex; justify-content: center; gap: 1.5cqw;
            height: 13cqw;
        }

        .body-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5cqw;
        }

        .col-left, .col-right {
            display: flex; flex-direction: column; align-items: center;
        }
        
        .col-left { gap: 3cqw; }
        .col-right { gap: 2cqw; }

        /* --- PHYSICAL LAYER FLIP ENGINE --- */
        .flip-unit {
            position: relative;
            perspective: 150cqw;
        }

        .upper, .lower, .leaf-front, .leaf-back {
            position: absolute; left: 0; width: 100%; height: calc(50% - (var(--gap) / 2));
            background-color: #252320 !important;
            color: var(--text-white);
            overflow: hidden; text-align: center; font-weight: 900;
            backface-visibility: hidden;
            opacity: 1 !important;
        }

        .upper { top: 0; border-radius: 1.5cqw 1.5cqw 0 0; border-bottom: 0.1cqw solid rgba(255,255,255,0.1); z-index: 1; }
        
        .lower { 
            bottom: 0; border-radius: 0 0 1.5cqw 1.5cqw; line-height: 0; 
            z-index: 1;
            transform: translateZ(-1cqw);
        }

        .leaf {
            position: absolute; top: 0; left: 0; width: 100%; height: calc(52% - (var(--gap) / 2));
            z-index: 5; 
            transform-origin: bottom;
            transform-style: preserve-3d; 
            transition: none; 
            transform: translateZ(1cqw);
        }

        .leaf-front, .leaf-back {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backface-visibility: hidden; background: #252320; color: var(--text-white);
            text-align: center; overflow: hidden;
        }

        .leaf-front { border-radius: 1.5cqw 1.5cqw 0 0; border-bottom: 0.1cqw solid rgba(255,255,255,0.1); z-index: 2; }
        .leaf-back { transform: rotateX(-270deg) translateZ(0.1cqw); border-radius: 0 0 1.5cqw 1.5cqw; line-height: 0; z-index: 2; }

        .flipping .leaf { 
            transition: transform var(--anim-speed) cubic-bezier(0.4, 0, 0.3, 1.5);
            transform: rotateX(-170deg) translateZ(0.1cqw);
        }

        .flip-unit::before {
            content: ''; position: absolute; top: 50%; left: -0.5cqw; right: -0.5cqw;
            height: 0.5cqw; background: #444; z-index: 10;
            border-radius: 1.5cqw; transform: translateY(-50%);
        }

        /* --- SIZES --- */
        .year-digit { 
            width: 9cqw; 
            height: 13cqw; 
            font-size: 11cqw; 
        }
        .year-digit .upper, .year-digit .leaf-front { line-height: 13cqw; }

        .day-name-flip, .month-flip { width: 30cqw; height: 13cqw; font-size: 8.5cqw; }
        .day-name-flip .upper, .day-name-flip .leaf-front,
        .month-flip .upper, .month-flip .leaf-front { line-height: 13cqw; }

        .day-num-group { grid-row: 2 / span 2; grid-column: 2; display: flex; gap: 1.5cqw; height: 30cqw; }
        .num-digit { 
            width: 17cqw; 
            height: 30cqw; 
            font-size: 28cqw; 
        }
        .num-digit .upper, .num-digit .leaf-front { line-height: 30cqw; }

        .sec-counter-group { display: flex; gap: 0.8cqw; justify-content: center; opacity: 0.8; }
        .sec-digit { width: 7cqw; height: 10cqw; font-size: 8cqw; }
        .sec-digit .upper, .sec-digit .leaf-front { line-height: 10cqw; }

        /* Analog Clock */
        .analog-clock {
            width: 40cqw; 
            height: 40cqw; 
            border-radius: 50%;
            background: #252320; position: relative; border: 0.3cqw solid #333;
            box-shadow: 0 1.5cqw 3cqw rgba(0,0,0,0.4);
        }
        .analog-marker { 
            position: absolute; width: 0.3cqw; height: 1.5cqw; background: #555; left: 50%; 
            transform-origin: 50% 20cqw; /* Hälfte der 40cqw */
        }
        .center-dot { position: absolute; top: 50%; left: 50%; width: 1.2cqw; height: 1.2cqw; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center; background: #fff; border-radius: 0.3cqw; }
        .hour-hand { width: 1cqw; height: 12cqw; margin-left: -0.5cqw; z-index: 8; }
        .min-hand { width: 0.6cqw; height: 16cqw; margin-left: -0.3cqw; z-index: 9; }
        .sec-hand { width: 0.3cqw; height: 16cqw; margin-left: -0.15cqw; background: #ff3b30; z-index: 11; }
    </style>
</head>
<body>

<div class="karlsson-container">
    <div class="inner-dial">
        <div id="year-group" class="header-year">
            <div class="flip-unit year-digit"><div class="upper">0</div><div class="lower">0</div><div class="leaf"><div class="leaf-front">0</div><div class="leaf-back">0</div></div></div>
            <div class="flip-unit year-digit"><div class="upper">0</div><div class="lower">0</div><div class="leaf"><div class="leaf-front">0</div><div class="leaf-back">0</div></div></div>
            <div class="flip-unit year-digit"><div class="upper">0</div><div class="lower">0</div><div class="leaf"><div class="leaf-front">0</div><div class="leaf-back">0</div></div></div>
            <div class="flip-unit year-digit"><div class="upper">0</div><div class="lower">0</div><div class="leaf"><div class="leaf-front">0</div><div class="leaf-back">0</div></div></div>
        </div>
        
        <div class="body-grid">
            <div class="col-left">
                <div id="day-name-unit" class="flip-unit day-name-flip">
                    <div class="upper">---</div><div class="lower">---</div>
                    <div class="leaf"><div class="leaf-front">---</div><div class="leaf-back">---</div></div>
                </div>
                <div class="analog-clock" id="analog">
                    <div class="center-dot"></div>
                    <div class="hand hour-hand" id="hr"></div>
                    <div class="hand min-hand" id="mn"></div>
                    <div class="hand sec-hand" id="sc"></div>
                </div>
            </div>

            <div class="col-right">
                <div id="day-num-group" style="display:flex; gap:1.5cqw;">
                    <div class="flip-unit num-digit"><div class="upper">0</div><div class="lower">0</div><div class="leaf"><div class="leaf-front">0</div><div class="leaf-back">0</div></div></div>
                    <div class="flip-unit num-digit"><div class="upper">0</div><div class="lower">0</div><div class="leaf"><div class="leaf-front">0</div><div class="leaf-back">0</div></div></div>
                </div>
                
                <div id="sec-group" class="sec-counter-group">
                    <div class="flip-unit sec-digit"><div class="upper">0</div><div class="lower">0</div><div class="leaf"><div class="leaf-front">0</div><div class="leaf-back">0</div></div></div>
                    <div class="flip-unit sec-digit"><div class="upper">0</div><div class="lower">0</div><div class="leaf"><div class="leaf-front">0</div><div class="leaf-back">0</div></div></div>
                </div>

                <div id="month-unit" class="flip-unit month-flip">
                    <div class="upper">---</div><div class="lower">---</div>
                    <div class="leaf"><div class="leaf-front">---</div><div class="leaf-back">---</div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const analog = document.getElementById('analog');
    for(let i=0; i<12; i++) {
        const m = document.createElement('div');
        m.className = 'analog-marker';
        m.style.transform = `rotate(${i*30}deg)`;
        analog.appendChild(m);
    }

    const DE_DAYS = ["SON", "MON", "DIE", "MIT", "DON", "FRE", "SAM"];
    const DE_MONTHS = ["JAN", "FEB", "MÄR", "APR", "MAI", "Juni", "Juli", "AUG", "SEP", "OKT", "NOV", "DEZ"];

    function update() {
        const now = new Date();
        const h = now.getHours();
        const m = now.getMinutes();
        const s = now.getSeconds();
        
        const yearStr = now.getFullYear().toString();
        const dayNumStr = now.getDate().toString().padStart(2, '0');
        const secStr = s.toString().padStart(2, '0');
        const dayName = DE_DAYS[now.getDay()];
        const monthName = DE_MONTHS[now.getMonth()];

        document.getElementById('hr').style.transform = `rotate(${(h * 30) + (m / 2)}deg)`;
        document.getElementById('mn').style.transform = `rotate(${m * 6}deg)`;
        document.getElementById('sc').style.transform = `rotate(${s * 6}deg)`;

        updateDigitGroup('year-group', yearStr);
        updateDigitGroup('day-num-group', dayNumStr);
        updateDigitGroup('sec-group', secStr);
        updateFlipUnit('day-name-unit', dayName);
        updateFlipUnit('month-unit', monthName);
    }

    function updateDigitGroup(groupId, valStr) {
        const group = document.getElementById(groupId);
        const units = group.querySelectorAll('.flip-unit');
        valStr.split('').forEach((digit, i) => {
            if (units[i]) updateFlipUnit(units[i], digit);
        });
    }

    function updateFlipUnit(elementOrId, val) {
        const unit = typeof elementOrId === 'string' ? document.getElementById(elementOrId) : elementOrId;
        
        if (unit.dataset.val !== val) {
            const old = unit.dataset.val || "0";
            const up = unit.querySelector('.upper');
            const low = unit.querySelector('.lower');
            const front = unit.querySelector('.leaf-front');
            const back = unit.querySelector('.leaf-back');

            unit.classList.remove('flipping');
            void unit.offsetWidth;

            front.textContent = old;
            back.textContent = val;
            up.textContent = val;
            low.textContent = old;

            unit.classList.add('flipping');

            setTimeout(() => {
                low.textContent = val;
            }, 300);

            setTimeout(() => { 
                unit.classList.remove('flipping');
                front.textContent = val;
            }, 600); 

            unit.dataset.val = val;
        }
    }

    setInterval(update, 1000);
    update();
</script>
</body>
</html>
