<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --body-bg: #f0f0f0;
            --wood-gradient: linear-gradient(135deg, #ecd0a5 0%, #e1b366 100%);
            --dial-bg: #1c1a17;
            --text-white: #ffffff;
            --divider: rgba(255, 255, 255, 0.1);
            --anim-speed: 0.69s;
            --gap: 5px;
            --clock-scale: 0.8
        }

        body { 
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; 
            background: transparent !important; font-family: 'Arial Black', sans-serif;
            overflow: hidden;
        }

        .karlsson-container {
            transform: scale(--clock-scale);
            width: 580px;
            height: 580px;
            background: var(--wood-gradient);
            border-radius: 40px;
            padding: 25px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.3), inset 0 2px 5px rgba(255,255,255,0.5);
            box-sizing: border-box;
        }

        .inner-dial {
            width: 100%; height: 100%;
            background: var(--dial-bg);
            border-radius: 20px;
            padding: 15px; 
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 80px 1fr;
            gap: 50px;
        }

        .header-year {
            grid-column: 1 / span 2;
            display: flex; justify-content: center; gap: 8px;
            height: 80px;
        }

        .body-grid {
            grid-column: 1 / span 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .col-left, .col-right {
            display: flex; flex-direction: column; align-items: center;
        }
        
        .col-left { gap: 20px; }
        .col-right { gap: 10px; }

        /* --- PHYSICAL LAYER FLIP ENGINE --- */
        .flip-unit {
            position: relative;
            perspective: 1000px; /* Erhöhte Perspektive für sattere Landung */
        }

        .upper, .lower, .leaf-front, .leaf-back {
            position: absolute; left: 0; width: 100%; height: calc(50% - (var(--gap) / 2));
            background-color: #252320 !important; /* Absolut deckend */
            color: var(--text-white);
            overflow: hidden; text-align: center; font-weight: 900;
            backface-visibility: hidden;
            opacity: 1 !important;
        }

        .upper { top: 0; border-radius: 8px 8px 0 0; border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 1; }
        
        .lower { 
            bottom: 0; border-radius: 0 8px 8px; line-height: 0; 
            z-index: 1;
            transform: translateZ(-10px);
        }

        .leaf {
            position: absolute; top: 0; left: 0; width: 100%; height: calc(52% - (var(--gap) / 2));
            z-index: 5; 
            transform-origin: bottom;
            transform-style: preserve-3d; 
            transition: none; 
            transform: translateZ(10px); /* Verhindert Z-Fighting */
        }

        .leaf-front, .leaf-back {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backface-visibility: hidden; background: var(--flap-bg); color: var(--text-white);
            text-align: center; font-size: var(--font-size); overflow: hidden;
        }

        .leaf-front { border-radius: 10px 10px 0 0; border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 2; }
        .leaf-back { transform: rotateX(-270deg) translateZ(1px); border-radius: 0 0 10px 10px; line-height: 0; z-index: 2; }

        .flipping .leaf { 
            transition: transform var(--anim-speed) cubic-bezier(0.4, 0, 0.3, 1.5);
            transform: rotateX(-170deg) translateZ(1px); /* Karlsson-Stop Winkel */
        }

        .flip-unit::before {
            content: ''; position: absolute; top: 50%; left: -3px; right: -3px;
            height: 3px; background: #444; z-index: 10;
            border-radius: 10px; transform: translateY(-50%);
        }

        /* --- SIZES --- */
        .year-digit { width: 52px; height: 80px; font-size: 69px; }
        .year-digit .upper, .year-digit .leaf-front { line-height: 80px; }

        .day-name-flip, .month-flip { width: 180px; height: 80px; font-size: 52px; }
        .day-name-flip .upper, .day-name-flip .leaf-front,
        .month-flip .upper, .month-flip .leaf-front { line-height: 80px; }

        .day-num-group { grid-row: 2 / span 2; grid-column: 2; display: flex; gap: 10px; height: 180px; }
        .num-digit { width: 100px; height: 180px; font-size: 172px; }
        .num-digit .upper, .num-digit .leaf-front { line-height: 180px; }

        .sec-counter-group { display: flex; gap: 5px; justify-content: center; opacity: 0.8; }
        .sec-digit { width: 45px; height: 60px; font-size: 46px; }
        .sec-digit .upper, .sec-digit .leaf-front { line-height: 60px; }

        /* Analog Clock */
        .analog-clock {
            width: 250px; height: 250px; border-radius: 50%;
            background: #252320; position: relative; border: 2px solid #333;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .analog-marker { position: absolute; width: 2px; height: 10px; background: #555; left: 50%; transform-origin: 50% 125px; }
        .center-dot { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center; background: #fff; border-radius: 2px; }
        .hour-hand { width: 6px; height: 80px; margin-left: -3px; z-index: 8; }
        .min-hand { width: 4px; height: 100px; margin-left: -2px; z-index: 9; }
        .sec-hand { width: 2px; height: 100px; margin-left: -1px; background: #ff3b30; z-index: 11; }
    </style>
</head>
<body>

<div class="karlsson-container">
    <div class="inner-dial">
        <div id="year-group" class="header-year">
            <div class="flip-unit year-digit"><div class="upper">0</div><div class="lower">0</div><div class="leaf"><div class="leaf-front">0</div><div class="leaf-back">0</div></div></div>
            <div class="flip-unit year-digit"><div class="upper">0</div><div class="lower">0</div><div class="leaf"><div class="leaf-front">0</div><div class="leaf-back">0</div></div></div>
            <div class="flip-unit year-digit"><div class="upper">0</div><div class="lower">0</div><div class="leaf"><div class="leaf-front">0</div><div class="leaf-back">0</div></div></div>
            <div class="flip-unit year-digit"><div class="upper">0</div><div class="lower">0</div><div class="leaf"><div class="leaf-front">0</div><div class="leaf-back">0</div></div></div>
        </div>
        
        <div class="body-grid">
            <div class="col-left">
                <div id="day-name-unit" class="flip-unit day-name-flip">
                    <div class="upper">---</div><div class="lower">---</div>
                    <div class="leaf"><div class="leaf-front">---</div><div class="leaf-back">---</div></div>
                </div>
                <div class="analog-clock" id="analog">
                    <div class="center-dot"></div>
                    <div class="hand hour-hand" id="hr"></div>
                    <div class="hand min-hand" id="mn"></div>
                    <div class="hand sec-hand" id="sc"></div>
                </div>
            </div>

            <div class="col-right">
                <div id="day-num-group" style="display:flex; gap:10px;">
                    <div class="flip-unit num-digit"><div class="upper">0</div><div class="lower">0</div><div class="leaf"><div class="leaf-front">0</div><div class="leaf-back">0</div></div></div>
                    <div class="flip-unit num-digit"><div class="upper">0</div><div class="lower">0</div><div class="leaf"><div class="leaf-front">0</div><div class="leaf-back">0</div></div></div>
                </div>
                
                <div id="sec-group" class="sec-counter-group">
                    <div class="flip-unit sec-digit"><div class="upper">0</div><div class="lower">0</div><div class="leaf"><div class="leaf-front">0</div><div class="leaf-back">0</div></div></div>
                    <div class="flip-unit sec-digit"><div class="upper">0</div><div class="lower">0</div><div class="leaf"><div class="leaf-front">0</div><div class="leaf-back">0</div></div></div>
                </div>

                <div id="month-unit" class="flip-unit month-flip">
                    <div class="upper">---</div><div class="lower">---</div>
                    <div class="leaf"><div class="leaf-front">---</div><div class="leaf-back">---</div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const analog = document.getElementById('analog');
    for(let i=0; i<12; i++) {
        const m = document.createElement('div');
        m.className = 'analog-marker';
        m.style.transform = `rotate(${i*30}deg)`;
        analog.appendChild(m);
    }

    const DE_DAYS = ["SON", "MON", "DIE", "MIT", "DON", "FRE", "SAM"];
    const DE_MONTHS = ["JAN", "FEB", "MÄR", "APR", "MAI", "Juni", "Juli", "AUG", "SEP", "OKT", "NOV", "DEZ"];

    function update() {
        const now = new Date();
        const h = now.getHours();
        const m = now.getMinutes();
        const s = now.getSeconds();
        
        const yearStr = now.getFullYear().toString();
        const dayNumStr = now.getDate().toString().padStart(2, '0');
        const secStr = s.toString().padStart(2, '0');
        const dayName = DE_DAYS[now.getDay()];
        const monthName = DE_MONTHS[now.getMonth()];

        document.getElementById('hr').style.transform = `rotate(${(h * 30) + (m / 2)}deg)`;
        document.getElementById('mn').style.transform = `rotate(${m * 6}deg)`;
        document.getElementById('sc').style.transform = `rotate(${s * 6}deg)`;

        updateDigitGroup('year-group', yearStr);
        updateDigitGroup('day-num-group', dayNumStr);
        updateDigitGroup('sec-group', secStr);
        updateFlipUnit('day-name-unit', dayName);
        updateFlipUnit('month-unit', monthName);
    }

    function updateDigitGroup(groupId, valStr) {
        const group = document.getElementById(groupId);
        const units = group.querySelectorAll('.flip-unit');
        valStr.split('').forEach((digit, i) => {
            if (units[i]) updateFlipUnit(units[i], digit);
        });
    }

    function updateFlipUnit(elementOrId, val) {
        const unit = typeof elementOrId === 'string' ? document.getElementById(elementOrId) : elementOrId;
        
        // Nur flippen, wenn sich der Wert wirklich geändert hat
        if (unit.dataset.val !== val) {
            const old = unit.dataset.val || "0";
            const up = unit.querySelector('.upper');
            const low = unit.querySelector('.lower');
            const front = unit.querySelector('.leaf-front');
            const back = unit.querySelector('.leaf-back');

            // Animation zurücksetzen für einen sauberen Neustart
            unit.classList.remove('flipping');
            void unit.offsetWidth; // Der "Magic Reflow"

            // --- PHASE 1: DER START (0ms) ---
            // Die Klappe (front) hält die alte Zahl fest
            front.textContent = old;
            // Die Rückseite (back) bereitet die neue Zahl vor (-270deg Vorspannung im CSS)
            back.textContent = val;
            // Oben im Hintergrund (up) erscheint SOFORT die neue Zahl
            up.textContent = val;
            // Unten (low) bleibt die alte Zahl, wird aber gleich "begraben"
            low.textContent = old;

            unit.classList.add('flipping');

            // --- PHASE 2: DER WECHSEL (300ms bei 0.6s Speed / 200ms bei 0.4s) ---
            // Genau wenn die Karte senkrecht steht, tauschen wir unten aus.
            // Das ist der Moment, in dem das Auge die "Befreiung" wahrnimmt.
            setTimeout(() => {
                low.textContent = val;
            }, 300); // Bei 0.4s Gesamtzeit hier 200 nutzen

            // --- PHASE 3: DIE LANDUNG (600ms bei 0.6s Speed / 400ms bei 0.4s) ---
            setTimeout(() => { 
                unit.classList.remove('flipping');
                // Vorderseite für den nächsten Durchgang neutralisieren
                front.textContent = val;
            }, 300); // Bei 0.4s Gesamtzeit hier 400 nutzen

            unit.dataset.val = val;
        }
    }

    setInterval(update, 1000);
    update();
</script>
</body>
</html>
